name: Deploy to shishir.nepeu.eu (cPanel)

# On every push to main: build the site and publish the built files
# (+ .cpanel.yml) to the `deploy` branch.
# The cPanel server picks up the `deploy` branch itself via a cron job.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: cp .cpanel.yml dist/

      - name: Publish built site to the deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: deploy
          publish_dir: ./dist
          commit_message: "Deploy ${{ github.sha }}"
