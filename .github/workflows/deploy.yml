name: Deploy to shishir.nepeu.eu (cPanel)

# On every push to main:
#  1. build the site
#  2. publish the built files (+ .cpanel.yml) to the `deploy` branch
#  3. ask cPanel to pull the `deploy` branch and run .cpanel.yml

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: cp .cpanel.yml dist/

      - name: Publish built site to the deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: deploy
          publish_dir: ./dist
          commit_message: "Deploy ${{ github.sha }}"

      - name: Tell cPanel to pull and deploy
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
          REPO_ROOT: /home/nepeueu/repositories/portfolio
        run: |
          if [ -z "$CPANEL_TOKEN" ]; then
            echo "::warning::cPanel secrets not set yet; deploy branch updated, skipping cPanel step."
            exit 0
          fi
          api() {
            out=$(curl -sS -w '\nHTTP %{http_code}' -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
              "https://${CPANEL_HOST}:2083/execute/$1" 2>&1)
            echo "$out" | head -c 800; echo
            if ! echo "$out" | grep -q '"status":1'; then
              msg=$(echo "$out" | tr '\n' ' ' | head -c 500)
              echo "::error::cPanel $1 -> $msg"
              exit 1
            fi
          }
          api "VersionControl/update?repository_root=${REPO_ROOT}&branch=deploy"
          api "VersionControlDeployment/create?repository_root=${REPO_ROOT}"
