name: Deploy to shishir.nepeu.eu (cPanel)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # Uploads the built site (dist/) to the cPanel folder for shishir.nepeu.eu.
      # Credentials come from the repo's Actions secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
      - name: Upload to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          log-level: verbose
          local-dir: ./dist/
          server-dir: ./
